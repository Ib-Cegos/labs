site_name: Ateliers ib Cegos
copyright: ib Cegos
favicon: themes/images/favicon.png

theme:
  name: mkdocs
  language: fr
  custom_dir: themes/original

hooks:
  - hooks/content_processor.py

plugins:
  - search
  - macros
  - git-revision-date-localized:
      enable_creation_date: false
      type: date
      locale: fr
      exclude: 
        - "*/README.md"
        - index.md

extra_css:
  - assets/contenu.css

extra_javascript:
  - assets/contenu.js  

markdown_extensions:
  - admonition
  - tables
  - toc
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

