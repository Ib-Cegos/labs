site_name: Ateliers ib Cegos
site_url: https://ib-cegos.github.io/labs
copyright: ib Cegos

theme:
  name: material
  language: fr
  custom_dir: overrides
  logo: assets/images/favicon.png
  favicon: assets/images/favicon.png

hooks:
  - main.py

plugins:
  - search
  - macros
  - git-revision-date-localized:
      enable_creation_date: false
      type: date
      locale: fr
      exclude: 
        - README.md
        - */README.md
  

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/css/main.css

extra_javascript:
  - assets/js/main.js

nav:
  - Accueil: index.md
  - msms030: msms030/README.md
  - ms503: ms503/README.md