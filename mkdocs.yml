site_name: Ateliers ib Cegos
site_url: https://www.ib-formation.fr
copyright: ib Cegos

theme:
  name: mkdocs
  language: fr
  custom_dir: theme/iblab

hooks:
  - hooks/content_processor.py

plugins:
  - search
  - macros
  - git-revision-date-localized:
      enable_creation_date: false
      type: date
      locale: fr
      exclude: 
        - "*/README.md"
        - index.md
  

markdown_extensions:
  - admonition
  - tables
  - toc
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

