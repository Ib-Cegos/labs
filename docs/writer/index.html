<!DOCTYPE html><html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Edition d'un stage</title>
    <link rel="stylesheet" href="../assets/contenu.css">
    <link rel="stylesheet" href="../assets/themes/original.css">
    <link rel="stylesheet" href="../writer/writer.css">
    <link rel="icon" href="../assets/images/favicon.png">
</head>
<body>
<header id="ibHeader">
    <input id="stageReference" placeholder="Référence">
    <input id="stageTitle" placeholder="Titre du stage">
    <input id="stageAuthor" placeholder="Auteur">
</header>
<main id="writerMain">
    <nav id="writerNavigation">
    </nav>
    <section id="writerEditor">
        <div id="ExerciceHeader">
            <label for="writerAtelierTitle">Atelier :</label>
            <input id="writerAtelierTitle">
            <button id="btnDeleteAtelier" class="ibDeleteButton" title="Supprimer l'atelier">✖</button>
            <label for="writerExerciceTitle">Exercice :</label>
            <input id="writerExerciceTitle">
            <button id="btnDeleteExercice" class="ibDeleteButton" title="Supprimer l'exercice">✖</button>
            <label for="writerExerciceLength">Durée :</label>
            <input id="writerExerciceLength">
        </div>
        <textarea id="writerContenu"></textarea>
    </section>
</main>
<footer id="ibFooter">
    <button id="btnAddAtelier" class="ibActionButton">+ Atelier</button>
    <button id="btnAddExercice" class="ibActionButton">+ Exercice</button>
    <button id="btnAddSommaire" class="ibActionButton">+ Sommaire</button>
    <button id="btnVariables" class="ibActionButton">Variables</button>
    <button id="btnTools" class="ibActionButton">🛠️ Outils</button>
    <button id="btnPreview" class="ibActionButton">Aperçu</button>
    <button id="btnExport" class="ibActionButton">Export JSON</button>
</footer>
<!-- Boîte de dialogue Writer -->
<div id="ibWriterDialogOverlay">
<aside id="ibWriterDialog" class="ibModal">
    <div class="ibModalHeader">
        <span id="ibWriterDialogTitle">Titre</span>
        <button id="ibWriterDialogClose" class="ibModalClose" title="Fermer">✕</button>
    </div>
    <div id="ibWriterDialogContent" class="ibModalContent"></div>
    <div id="ibWriterDialogButtons"></div>
</aside>
</div>
<!-- Barre d'outils ibCAN -->
<div id="ibWriterStyleBar">
    <span class="ibWriterStyleHandle">✎</span>
    <button title="Titre de section" onclick="setHeading(2);">T1</button>
    <button title="Titre de sous-section" onclick="setHeading(3);">T2</button>
    <span class="ibWriterStyleSeparator"></span>
    <button title="Gras" onclick="toggleBold()"><b>B</b></button>
    <button title="Italique" onclick="toggleItalic()"><i>I</i></button>
    <button title="Ligne/Bloc de code" onclick="toggleCode()">Code</button>
    <span class="ibWriterStyleSeparator"></span>
    <button title="Tâche numérotée" onclick="toggleNumberedList();">1.</button>
    <button title="Puce" onclick="toggleBulletList();">•</button>
    <button title="Note" onclick="toggleBlockquote();">></button>
    <span class="ibWriterStyleSeparator"></span>
    <button title="Lien" onclick="insertLink();">🔗</button>
    <button title="Image/Illustration" disabled>🖼️</button>
    <button title="Variables" id="styleBarVarButton" onclick="openVariableInsert();">[ ]</button>
    <button title="Tableau" onclick="openTableEditor();">⊞</button>
    <span class="ibWriterStyleSeparator"></span>
    <button id = "btnUndo" onclick = "undoLastAction();">↩</button>
    <button id = "btnRedo" onclick = "redoLastAction();">↪</button>
    <button id="ibWriterStyleClose" class="ibModalClose" title="Fermer">✕</button>
</div>
<script src="../assets/common.js"></script>
<script src="../writer/writer.js"></script>
</body></html>
