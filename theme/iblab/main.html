<!DOCTYPE html><html lang="fr">
<head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ 'css/iblab.css' | url }}">
    <link rel="stylesheet" href="{{ 'css/main.css' | url }}">
    <link rel="icon" href="{{ 'images/favicon.png' | url }}">
    <link rel="shortcut icon" href="{{ 'images/favicon.png' | url }}">
</head>
<body>
<header id="ibHeader">
    <div id="ibHeaderTitle">{{ page.title }}</div>
    <div id="ibHeaderBrand">
        ibLab
    </div>
</header>

<main id="ibContent">
    {{ page.content }}
</main>

<footer id="ibFooter">
    <div id="ibFooterTools">
        <button class="ibActionButton" id="ibSettingsButton" >⚙ Paramètres</button>
        <button class="ibActionButton" id="ibHelpButton">❓ Aide</button>
    </div>
    <div id="ibFooterNavigation">
        {{ ibNav }}
    </div>
    <div id="ibFooterCorporate">
        <a href="https://www.ib-formation.fr" title="Site web ib Cegos" taget = "_blank">ib Cegos</a>
    </div>
</footer>
<script src="{{ 'js/main.js' | url }}"></script>
<script src="{{ 'js/iblab.js' | url }}"></script>
</body></html>
