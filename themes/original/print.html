<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="/labs/assets/contenu.css">
    <link rel="stylesheet" href="/labs/assets/print.css">
    <link rel="stylesheet" href="{{ 'theme.css' | url }}">
    <link rel="icon" href="{{ config.site_url }}assets/images/favicon.png">
</head>

<body class="ibPrintPage">
    <div id="ibPrintContent">
        {{ page.content }}
    </div>
    <div id="ibPrintSetupDialog">
        <div class="ibPrintSetupHeader">Préparation du document</div>
        <div class="ibPrintSetupBody">
            <p> Configurez les options d'impression du cahier d'ateliers. </p>
            <div class="ibPrintSetupButtons">
                <button id="ibPrintButton">Imprimer</button>
                <button id="ibClosePrintSetup">Fermer</button>
            </div>
        </div>
    </div>
    <div id="ibPrintSetupOverlay"></div>
    <script src="/labs/assets/print.js"></script>
</body>
</html>
