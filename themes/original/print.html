<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="/labs/assets/contenu.css">
    <link rel="stylesheet" href="/labs/assets/print.css">
    <link rel="stylesheet" href="{{ 'theme.css' | url }}">
    <link rel="icon" href="{{ config.site_url }}assets/images/favicon.png">
</head>

<body class="ibPrintPage">
    <div id="ibPrintContent">
        {{ page.content }}
    </div>
    <div id="ibPrintSetupDialog">
        <div class="ibPrintSetupHeader">
            <span>🖨 Préparation du document</span>
            <button id="ibPrintSetupClose" title="Fermer">✕</button>
        </div>
        <div class="ibPrintSetupBody">
            <p> Confgurez le contenu du cahier d'ateliers avant impression. </p>
            <p>(Rappel: Les variables permettent de personnaliser les informations utilisées dans cet atelier.)</p>
                <div class="ibPrintSetupSection"> <h3>Variables</h3>
                    <label class="ibCheckboxContainer">
                    <input type="checkbox" id="useCustomVariables" unchecked>
                    Utiliser mes valeurs de variables</label>
                </div>
                <div class="ibPrintSetupSection">
                    <h3>Notes personnelles</h3>
                    <label class="ibCheckboxContainer">
                    <input type="checkbox" id="includePersonalNotes" unchecked>
                    Inclure mes notes personnelles</label>
                <div id="notesSummary">
                    0 note trouvée
                </div>
            </div>
            <div class="ibPrintSetupButtons">
                <button id="ibPrintButton">Imprimer</button>
            </div>
        </div>
    </div>
    <div id="ibPrintSetupOverlay"></div>
    <script src="/labs/assets/print.js"></script>
</body>
</html>
